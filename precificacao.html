<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela VD — Precificação B2B Venda Direta | Controle Total GGE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#0d1117; color:#e6edf3; }
    .main-with-sidebar { margin-left:48px; min-height:100vh; padding:24px; }
    h1 { font-size:20px; margin-bottom:4px; }
    .sub { color:#8b949e; font-size:13px; margin-bottom:18px; }
    .bar { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:16px; background:#161b22; border:1px solid #30363d; border-radius:10px; padding:12px 16px; }
    .bar label { font-size:12px; color:#8b949e; margin-right:6px; }
    select, input { background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:6px; padding:7px 10px; font-size:13px; }
    .pill { font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; }
    .nac { background:rgba(63,185,80,.15); color:#3fb950; border:1px solid rgba(63,185,80,.4); }
    .imp { background:rgba(210,153,34,.15); color:#d29922; border:1px solid rgba(210,153,34,.4); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    thead th { text-align:right; padding:10px 12px; color:#8b949e; font-weight:600; border-bottom:2px solid #30363d; position:sticky; top:0; background:#0d1117; white-space:nowrap; }
    thead th.l, tbody td.l { text-align:left; }
    tbody td { padding:9px 12px; text-align:right; border-bottom:1px solid #21262d; white-space:nowrap; }
    tbody tr:hover { background:#161b22; cursor:pointer; }
    .muted { color:#8b949e; }
    .search { flex:1; min-width:180px; }
    .count { color:#8b949e; font-size:12px; }
    /* modal */
    .ovl { position:fixed; inset:0; background:rgba(1,4,9,.7); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:50; }
    .ovl.open { display:flex; }
    .modal { background:#161b22; border:1px solid #30363d; border-radius:12px; max-width:880px; width:100%; padding:22px; }
    .modal h2 { font-size:17px; margin-bottom:2px; }
    .quad { background:#0d1117; border:1px solid #30363d; border-radius:10px; padding:14px 16px; margin-top:14px; }
    .quad h3 { font-size:13px; color:#58a6ff; text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px; }
    .kv { display:grid; grid-template-columns:1fr auto; gap:4px 16px; font-size:13px; }
    .kv .k { color:#8b949e; }
    .kv .v { text-align:right; }
    .modal table { font-size:12.5px; }
    .modal thead th { background:#0d1117; }
    .close { float:right; background:none; border:1px solid #30363d; color:#e6edf3; border-radius:6px; padding:4px 10px; cursor:pointer; }
    .err { color:#f85149; padding:16px; }
    .tot { border-top:1px solid #30363d; font-weight:700; }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-with-sidebar">
    <h1>Tabela VD — Precificação Venda Direta</h1>
    <div class="sub">Venda direta B2B · GGE (Lucro Real) · saída SP · contribuinte (indústria/revenda) · sem comissão. Clique numa linha para a memória de cálculo completa.</div>

    <div class="bar">
      <div><label>UF destino</label><select id="uf"></select></div>
      <div class="search"><input id="busca" placeholder="buscar produto ou SKU..." style="width:100%"></div>
      <div class="count" id="count"></div>
    </div>

    <div id="wrap"></div>
  </div>

  <div class="ovl" id="ovl"><div class="modal" id="modal"></div></div>

  <script>
    (function(){ var a=sessionStorage.getItem('gge_auth'); if(a!=='gge2026'){ window.location.href='/'; } })();
    var sb = supabase.createClient(window.GGE_SUPABASE_URL, window.GGE_SUPABASE_KEY);

    // ---- Constantes fiscais (skill calculo-margem / regras do Neco 11/06/2026) ----
    var PIS_COFINS = 0.0925;     // débito na venda
    var DAS_TOOW   = 0.0865;     // Simples Nacional (substitui ICMS/PIS/COFINS)
    var UF_ORIGEM  = 'SP';       // venda direta sai da filial SP
    var MCS = [0.50,0.45,0.40,0.35,0.30];

    // Alíquotas internas por UF (fonte: icms_aliquotas_uf — snapshot). RJ já com +2% FCP. ES fora do grupo S/SE.
    var UFS = [
      {s:'AC',n:'Acre',i:19.0,ss:false},{s:'AL',n:'Alagoas',i:19.0,ss:false},{s:'AM',n:'Amazonas',i:20.0,ss:false},
      {s:'AP',n:'Amapá',i:18.0,ss:false},{s:'BA',n:'Bahia',i:19.5,ss:false},{s:'CE',n:'Ceará',i:20.0,ss:false},
      {s:'DF',n:'Distrito Federal',i:20.0,ss:false},{s:'ES',n:'Espírito Santo',i:17.0,ss:false},{s:'GO',n:'Goiás',i:19.0,ss:false},
      {s:'MA',n:'Maranhão',i:22.0,ss:false},{s:'MG',n:'Minas Gerais',i:18.0,ss:true},{s:'MS',n:'Mato Grosso do Sul',i:17.0,ss:false},
      {s:'MT',n:'Mato Grosso',i:17.0,ss:false},{s:'PA',n:'Pará',i:19.0,ss:false},{s:'PB',n:'Paraíba',i:20.0,ss:false},
      {s:'PE',n:'Pernambuco',i:20.5,ss:false},{s:'PI',n:'Piauí',i:21.0,ss:false},{s:'PR',n:'Paraná',i:19.5,ss:true},
      {s:'RJ',n:'Rio de Janeiro',i:22.0,ss:true},{s:'RN',n:'Rio Grande do Norte',i:20.0,ss:false},{s:'RO',n:'Rondônia',i:19.5,ss:false},
      {s:'RR',n:'Roraima',i:20.0,ss:false},{s:'RS',n:'Rio Grande do Sul',i:17.0,ss:true},{s:'SC',n:'Santa Catarina',i:17.0,ss:true},
      {s:'SE',n:'Sergipe',i:19.0,ss:false},{s:'SP',n:'São Paulo',i:18.0,ss:true},{s:'TO',n:'Tocantins',i:20.0,ss:false}
    ];
    function ufObj(s){ for(var k=0;k<UFS.length;k++){ if(UFS[k].s===s) return UFS[k]; } return null; }
    var isImport = function(o){ return o && /^import/i.test(o); };  // origem ILIKE 'Import%'

    // ICMS de débito da NF (saída SP), seção 2.6 da skill
    function icmsAliq(origem, ufDest){
      var u = ufObj(ufDest); if(!u) return 18.0;
      if(ufDest === UF_ORIGEM) return u.i;            // mesma UF: interna (SP 18%)
      if(isImport(origem)) return 4.0;                // importado interestadual: 4% sempre
      return u.ss ? 12.0 : 7.0;                       // nacional interestadual: S/SE 12% (exceto ES) | resto 7%
    }
    // Preço GGE: PV = custo / (1 - ICMS% - PIS/COFINS% - [DIFAL%] - MC%)
    function pvGGE(custo, origem, ufDest, mc, comFinal){
      if(!(custo>0)) return null;
      var icms = icmsAliq(origem, ufDest)/100;
      var difal = 0;
      if(comFinal && ufDest!==UF_ORIGEM){ var u=ufObj(ufDest); difal = Math.max(0, (u.i - icmsAliq(origem,ufDest)))/100; }
      var den = 1 - icms - PIS_COFINS - difal - mc;
      if(den<=0) return null;
      return custo/den;
    }
    function pvTOOW(custo, mc){ if(!(custo>0)) return null; var den=1-DAS_TOOW-mc; return den>0?custo/den:null; }
    function brl(v){ return v==null?'—':'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function pct(v){ return (v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2})+'%'; }

    // ---- carregamento de dados ----
    async function fetchAll(table, cols, filterFn){
      var out=[], from=0, step=1000;
      while(true){
        var q = sb.from(table).select(cols).range(from, from+step-1);
        var r = await q; if(r.error){ throw r.error; }
        out = out.concat(r.data||[]);
        if(!r.data || r.data.length<step) break;
        from += step;
      }
      return out;
    }

    var PRODUTOS = [];
    async function load(){
      try{
        var sc = await fetchAll('skus_custo','sku,descricao,origem,is_combo,custo_cif_sp');
        var hist = await fetchAll('skus_custo_historico','sku,empresa,custo_cif_sp,preco_fob,ipi_valor,st_valor,frete,icms_credito,pis_cofins_credito,data_vigencia');
        // último por sku+empresa
        var latest={};
        hist.sort(function(a,b){ return (a.data_vigencia<b.data_vigencia)?1:-1; });
        hist.forEach(function(h){ var k=h.sku+'|'+h.empresa; if(!latest[k]) latest[k]=h; });
        PRODUTOS = sc.filter(function(p){ return !p.is_combo; }).map(function(p){
          var g = latest[p.sku+'|GGE'];
          var t = latest[p.sku+'|TOOW'];
          var custoSP = (g && g.custo_cif_sp) ? Number(g.custo_cif_sp) : (p.custo_cif_sp?Number(p.custo_cif_sp):null);
          return {
            sku:p.sku, descricao:p.descricao||p.sku, origem:p.origem||'',
            importado:isImport(p.origem),
            custoSP:custoSP, gge:g||null, toow:t||null
          };
        }).filter(function(p){ return p.custoSP>0; })
          .sort(function(a,b){ return a.descricao.localeCompare(b.descricao); });
        render();
      }catch(e){
        document.getElementById('wrap').innerHTML='<div class="err">Erro ao carregar dados: '+(e.message||e)+'</div>';
      }
    }

    function render(){
      var uf = document.getElementById('uf').value;
      var termo = (document.getElementById('busca').value||'').toLowerCase();
      var lista = PRODUTOS.filter(function(p){ return !termo || p.descricao.toLowerCase().indexOf(termo)>=0 || p.sku.toLowerCase().indexOf(termo)>=0; });
      var h = '<table><thead><tr>'+
        '<th class="l">PRODUTO</th><th class="l">SKU</th><th class="l">ORIGEM</th><th>ICMS</th><th>CUSTO CIF (SP)</th>'+
        MCS.map(function(m){return '<th>'+Math.round(m*100)+'% MC</th>';}).join('')+'</tr></thead><tbody>';
      lista.forEach(function(p,idx){
        var icms = icmsAliq(p.origem, uf);
        h += '<tr data-i="'+PRODUTOS.indexOf(p)+'">'+
          '<td class="l">'+p.descricao+'</td>'+
          '<td class="l muted">'+p.sku+'</td>'+
          '<td class="l"><span class="pill '+(p.importado?'imp':'nac')+'">'+(p.importado?'Importado':'Nacional')+'</span></td>'+
          '<td>'+pct(icms)+'</td>'+
          '<td>'+brl(p.custoSP)+'</td>'+
          MCS.map(function(m){ return '<td>'+brl(pvGGE(p.custoSP,p.origem,uf,m,false))+'</td>'; }).join('')+
        '</tr>';
      });
      h += '</tbody></table>';
      document.getElementById('wrap').innerHTML = h;
      document.getElementById('count').textContent = lista.length+' produtos · destino '+uf;
      Array.prototype.forEach.call(document.querySelectorAll('#wrap tr[data-i]'), function(tr){
        tr.addEventListener('click', function(){ openModal(PRODUTOS[+tr.getAttribute('data-i')]); });
      });
    }

    function linhasMC(custo, origem, uf, comFinal){
      return MCS.map(function(m){
        return '<tr><td class="l">'+Math.round(m*100)+'% MC</td><td>'+brl(pvGGE(custo,origem,uf,m,comFinal))+'</td></tr>';
      }).join('');
    }

    function openModal(p){
      var uf = document.getElementById('uf').value, u=ufObj(uf);
      var icms = icmsAliq(p.origem, uf);
      var difal = (uf!==UF_ORIGEM)? Math.max(0, u.i - icms) : 0;
      var g = p.gge||{};
      // Quadro 2 — compra
      var fob=Number(g.preco_fob)||0, ipi=Number(g.ipi_valor)||0, st=Number(g.st_valor)||0, fre=Number(g.frete)||0,
          cicms=Number(g.icms_credito)||0, cpis=Number(g.pis_cofins_credito)||0;
      var compra = '<div class="kv">'+
        '<span class="k">Preço (FOB)</span><span class="v">'+brl(fob)+'</span>'+
        '<span class="k">IPI</span><span class="v">'+brl(ipi)+'</span>'+
        '<span class="k">ST</span><span class="v">'+brl(st)+'</span>'+
        '<span class="k">Frete compra</span><span class="v">'+brl(fre)+'</span>'+
        '<span class="k">(–) Crédito ICMS</span><span class="v">'+brl(-cicms)+'</span>'+
        '<span class="k">(–) Crédito PIS/COFINS</span><span class="v">'+brl(-cpis)+'</span>'+
        '<span class="k tot">Custo CIF (SP)</span><span class="v tot">'+brl(p.custoSP)+'</span>'+
      '</div>';
      var toowCusto = (p.toow && p.toow.custo_cif_sp)?Number(p.toow.custo_cif_sp):null;
      var toowBloco = toowCusto>0
        ? '<table><thead><tr><th class="l">MC</th><th>Preço Toow</th></tr></thead><tbody>'+
          MCS.map(function(m){return '<tr><td class="l">'+Math.round(m*100)+'% MC</td><td>'+brl(pvTOOW(toowCusto,m))+'</td></tr>';}).join('')+
          '</tbody></table><div class="sub" style="margin-top:8px">Custo próprio Toow: '+brl(toowCusto)+' · DAS 8,65% · sem ICMS/PIS/COFINS/DIFAL</div>'
        : '<div class="muted">Sem custo próprio da Toow cadastrado — não calculado (regra: nunca usar custo GGE para a Toow).</div>';

      var html = '<button class="close" onclick="document.getElementById(\'ovl\').classList.remove(\'open\')">fechar</button>'+
        '<h2>'+p.descricao+'</h2><div class="sub">'+p.sku+'</div>'+
        '<div class="quad"><h3>1 · Produto</h3><div class="kv">'+
          '<span class="k">Origem</span><span class="v"><span class="pill '+(p.importado?'imp':'nac')+'">'+(p.importado?'Importado':'Nacional')+'</span></span>'+
          '<span class="k">UF de compra</span><span class="v">SP (filial)</span>'+
          '<span class="k">Custo CIF (SP)</span><span class="v">'+brl(p.custoSP)+'</span>'+
        '</div></div>'+
        '<div class="quad"><h3>2 · Memória da compra</h3>'+compra+'</div>'+
        '<div class="quad"><h3>3 · Venda — contribuinte, interestadual ('+uf+')</h3>'+
          '<div class="kv"><span class="k">ICMS débito</span><span class="v">'+pct(icms)+'</span>'+
          '<span class="k">PIS/COFINS</span><span class="v">9,25%</span>'+
          '<span class="k">DIFAL</span><span class="v">0 (contribuinte)</span></div>'+
          '<table style="margin-top:8px"><thead><tr><th class="l">MC</th><th>Preço</th></tr></thead><tbody>'+
          linhasMC(p.custoSP,p.origem,uf,false)+'</tbody></table></div>'+
        '<div class="quad"><h3>4 · Se for consumidor final ('+uf+')</h3>'+
          '<div class="kv"><span class="k">ICMS débito</span><span class="v">'+pct(icms)+'</span>'+
          '<span class="k">DIFAL</span><span class="v">'+(uf===UF_ORIGEM?'0 (mesma UF)':pct(difal))+'</span></div>'+
          '<table style="margin-top:8px"><thead><tr><th class="l">MC</th><th>Preço</th></tr></thead><tbody>'+
          linhasMC(p.custoSP,p.origem,uf,true)+'</tbody></table></div>'+
        '<div class="quad"><h3>5 · Se fosse pela Toow</h3>'+toowBloco+'</div>';
      document.getElementById('modal').innerHTML = html;
      document.getElementById('ovl').classList.add('open');
    }
    document.getElementById('ovl').addEventListener('click', function(e){ if(e.target.id==='ovl') this.classList.remove('open'); });

    // init UF selector
    var sel=document.getElementById('uf');
    sel.innerHTML = UFS.filter(function(u){return u.s!=='SP';}).map(function(u){return '<option value="'+u.s+'"'+(u.s==='MG'?' selected':'')+'>'+u.n+' ('+u.s+')</option>';}).join('')
      + '<option value="SP">São Paulo (SP) — mesma UF</option>';
    sel.addEventListener('change', render);
    document.getElementById('busca').addEventListener('input', render);
    load();
  </script>
  <script src="sidebar.js" defer></script>
</body>
</html>
