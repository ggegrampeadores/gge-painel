<script>
  // O Controle de Estoque passou a usar o login unico do painel (/login.html).
  // A sessao e a mesma, entao basta encaminhar para la com o destino de volta.
  (function () {
    var n = new URLSearchParams(location.search).get('next');
    var destino = n && /^[a-z-]+$/.test(n) ? '/controle-estoque/' + n : '/controle-estoque/index.html';
    location.replace('/login.html?next=' + encodeURIComponent(destino));
  })();
</script>
</head>
